name: GPT README Suggestion

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write  # Needed for committing back to repo

jobs:
  suggest-readme:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo with full history
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Detect changed Python files
      - name: Detect changed Python files
        id: detect
        run: |
          if [ "$(git rev-list --count HEAD)" -eq 1 ]; then
            CHANGED_FILES=$(git ls-tree --name-only -r HEAD | grep ".py$" || true)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep ".py$" || true)
          fi

          CHANGED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
          echo "Changed Python files: \"$CHANGED_FILES\""
          echo "CHANGED_PY_FILES=$CHANGED_FILES" >> $GITHUB_ENV

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pandas python-dotenv

      # 5️⃣ Generate README suggestion
      - name: Generate README suggestion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGED_PY_FILES: ${{ env.CHANGED_PY_FILES }}
        run: |
          if [ -z "$CHANGED_PY_FILES" ]; then
            echo "ℹ️ No Python files changed. Skipping README suggestion."
          else
            echo "✅ Python files changed: \"$CHANGED_PY_FILES\""
            python generate_readme.py
          fi

      # 6️⃣ Commit and push README changes
      - name: Commit and push README changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ensure README.md exists
          if [ ! -f README.md ]; then
            echo "# Project" > README.md
          fi

          git add README.md
          git diff --quiet || git commit -m "Update README.md based on code changes"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
