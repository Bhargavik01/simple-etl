name: GPT README Suggestion

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  suggest-readme:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo with full history
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Detect changed Python files
      - name: Detect changed Python files
        id: detect
        run: |
          # Get Python files changed in this push/PR
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep ".py$" || true)
          echo "Changed Python files: $CHANGED_FILES"

          # Save for next steps
          echo "CHANGED_PY_FILES=$CHANGED_FILES" >> $GITHUB_ENV

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pandas python-dotenv

      # 5️⃣ Run GPT README script if Python files changed
      - name: Generate README suggestion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANGED_PY_FILES: ${{ env.CHANGED_PY_FILES }}
        run: |
          if [ -z "$CHANGED_PY_FILES" ]; then
            echo "ℹ️ No Python files changed. Skipping README suggestion."
          else
            echo "✅ Python files changed: $CHANGED_PY_FILES"
            python generate_readme.py
          fi
